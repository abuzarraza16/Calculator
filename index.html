<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="calculator">
    <h1 class="title">My Calculator</h1>

    <div class="display">
      <div id="previous-operand" class="previous-operand"></div>
      <div id="current-operand" class="current-operand">0</div>
    </div>

    <div class="buttons">

      <button class="btn function" data-action="clear">AC</button>
      <button class="btn function" data-action="delete">DEL</button>
      <button class="btn function" data-action="percent">%</button>
      <button class="btn operator" data-operator="/">÷</button>

      <button class="btn" data-number="7">7</button>
      <button class="btn" data-number="8">8</button>
      <button class="btn" data-number="9">9</button>
      <button class="btn operator" data-operator="*">×</button>

      <button class="btn" data-number="4">4</button>
      <button class="btn" data-number="5">5</button>
      <button class="btn" data-number="6">6</button>
      <button class="btn operator" data-operator="-">−</button>

      <button class="btn" data-number="1">1</button>
      <button class="btn" data-number="2">2</button>
      <button class="btn" data-number="3">3</button>
      <button class="btn operator" data-operator="+">+</button>

      <button class="btn function" data-action="negate">+/−</button>
      <button class="btn" data-number="0">0</button>
      <button class="btn" data-action="decimal">.</button>
      <button class="btn equals" data-action="equals">=</button>

    </div>
  </main>

  <!-- Connects the JavaScript file (logic) -->
  <script src="script.js"></script>
</body>
</html>
